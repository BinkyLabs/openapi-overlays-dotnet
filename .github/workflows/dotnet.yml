name: Build, test and publish dotnet
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.x
      - name: Setup .NET 9
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 9.x
      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Check formatting
        run: dotnet format --verify-no-changes
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release --coverlet --coverlet-output-format cobertura --report-gh
      - name: Install report generator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
      - name: Pack the project
        run: dotnet pack --configuration Release
      - name: Generate coverage report
        run: reportgenerator -reporttypes:"MarkdownSummaryGithub;Cobertura" -reports:**/coverage.cobertura.*.xml -targetdir:./reports/coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: reports/coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: src/*/bin/Release/*.*nupkg
          if-no-files-found: error
      - name: Publish coverage report to GitHub Step Summary
        run: |
          cat reports/coverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  upload-coverage:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)
    needs: dotnet-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Upload coverage report
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: Cobertura.xml
          language: CSharp
          label: code-coverage/dotnet

  validate-performance:
    name: Validate performance of the library
    runs-on: ubuntu-latest
    needs: [dotnet-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.x
      - name: Copy committed results
        run: |
          mkdir -p ./performanceResults
          cp ./performance/benchmark/BenchmarkDotNet.Artifacts/results/*-report.json ./performanceResults
      - name: Run performance tests
        run: dotnet run -c Release
        working-directory: ./performance/benchmark
      - name: Publish benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: benchmark-results
          path: ${{ github.workspace }}/performance/benchmark/BenchmarkDotNet.Artifacts/results
      - name: Compare overlay loading benchmark results
        run: dotnet run -c Release --project ./performance/resultsComparer/ResultsComparer.csproj -- compare $OLD_REPORT $NEW_REPORT -p OnePercentDifferenceMemoryUsage
        shell: bash
        env:
          NEW_REPORT: ${{ github.workspace }}/performance/benchmark/BenchmarkDotNet.Artifacts/results/performance.OverlayLoading-report.json
          OLD_REPORT: ${{ github.workspace }}/performanceResults/performance.OverlayLoading-report.json
      - name: Compare overlay application benchmark results
        run: dotnet run -c Release --project ./performance/resultsComparer/ResultsComparer.csproj -- compare $OLD_REPORT $NEW_REPORT -p OnePercentDifferenceMemoryUsage
        shell: bash
        env:
          NEW_REPORT: ${{ github.workspace }}/performance/benchmark/BenchmarkDotNet.Artifacts/results/performance.OverlayApplication-report.json
          OLD_REPORT: ${{ github.workspace }}/performanceResults/performance.OverlayApplication-report.json
   
  publish-release-to-nuget:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: dotnet-build
    permissions:
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        run: dotnet nuget push '**/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  upload-release-assets:
    needs: publish-release-to-nuget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: Attach packages to the GitHub release
        shell: bash
        run: |
          shopt -s globstar nullglob
          packages=(./**/*.nupkg)
          test "${#packages[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" "${packages[@]}" ./**/*.snupkg --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-{{branch}}
            type=raw,value=v2,enable=${{ startsWith(github.ref, 'refs/tags/v2') }}
            type=raw,value=v3,enable=${{ startsWith(github.ref, 'refs/tags/v3') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v3') }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'type=oci,dest=image.tar' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: image.tar
          if-no-files-found: error
          compression-level: 0

  publish-container:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the built image without rebuilding
        shell: bash
        env:
          IMAGE_TAGS: ${{ needs.docker-build.outputs.tags }}
          IMAGE_DIGEST: ${{ needs.docker-build.outputs.digest }}
        run: |
          test -n "$IMAGE_TAGS"
          digest=$(skopeo inspect --raw oci-archive:image.tar | sha256sum)
          test "sha256:${digest%% *}" = "$IMAGE_DIGEST"
          while IFS= read -r tag; do
            skopeo copy --all --preserve-digests oci-archive:image.tar "docker://$tag"
          done <<< "$IMAGE_TAGS"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.docker-build.outputs.digest }}
          push-to-registry: true